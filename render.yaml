services:
  - type: web
    name: seads-backend
    runtime: node
    rootDir: seads-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false   # Set in Render dashboard — Supabase PostgreSQL connection string
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false   # Set in Render dashboard — base64 encoded serviceAccountKey.json
      - key: ALLOWED_ORIGIN
        sync: false   # Set in Render dashboard — your Flutter app's origin or *
    autoDeploy: true
    healthCheckPath: /
